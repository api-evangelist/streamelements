        player:
          delay: 0
        limits:
          users:
            free: 5
            paid: 0
          queueLimit: 10
          maxDuration: 420
        backupPlaylist:
          url: https://www.youtube.com/playlist?list=UUp8OOssjSjGZRVYK6zWbNLg
