      - mode
      - moderation
      - _id
      - bannedUsers
      type: object
      properties:
        player:
          $ref: '#/components/schemas/Player'
        limits:
          $ref: '#/components/schemas/Limits'
        backupPlaylist:
          $ref: '#/components/schemas/BackupPlaylist'
        bot:
          $ref: '#/components/schemas/Bot1'
        tips:
          $ref: '#/components/schemas/Tips'
        youtube:
          $ref: '#/components/schemas/Youtube'
        enabled:
          type: boolean
        mode:
          type: string
        moderation:
          type: boolean
        _id:
          type: string
        bannedUsers:
          type: array
          items:
            type: string
          description: ''
