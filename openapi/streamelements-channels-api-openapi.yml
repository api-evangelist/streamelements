  /channels/{channel}:
    get:
      tags:
      - channels
      summary: /:channel
      description: Get channel details for provided channel id or channel name
      operationId: Get/:channel12345
      parameters:
      - name: channel
        in: path
        description: String|guid - Channel name or channel id
        required: true
        style: simple
        schema:
          type: string
          example: leeeeex
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json
      responses:
        '200':
          description: ''
          headers:
            Date:
              content:
