          type: boolean
        message:
          type: string
      example:
        enabled: true
        message: '{user} just redeemed {item} PogChamp'
    Cooldown:
      title: Cooldown
      required:
      - user
      - global
      type: object
      properties:
        user:
          type: integer
          format: int32
        global:
          type: integer
          format: int32
      example:
        user: 15
        global: 5
    TipBot:
      title: Tip
      required:
