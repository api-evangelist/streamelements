                  template: '/me PogChamp new Tweet from {user}: {tweet}'
                  followed:
                  - twitchsupport
                  - streamelements
                chatalerts:
                  follow:
                    enabled: true
                    messages:
                    - Thank you for following {user} :)
                  tip:
                    enabled: true
                    messages:
                    - _id: 5b2e2007760aebcb99487dbb
                      amount: 1
                      message: '{user} just tipped {currency}{amount} PogChamp'
                  host:
                    enabled: true
                    messages:
