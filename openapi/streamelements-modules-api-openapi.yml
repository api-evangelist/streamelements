        messages:
          win: '@{user} you got {emotes} and won {points} ${pointsname} PogChamp //'
          lose: '@{user} you got {emotes} and lost your {points} ${pointsname} LUL'
        enabled: false
        returnAmount: 80
        minAmount: 100
        emotes:
        - Kappa
        - PogChamp
        - BibleThump
        - OpieOP
        - 4Head
    Songrequest:
      title: Songrequest
      required:
      - voteskip
      - enabled
      - moderation
      - minUserLevel
      - cost
      - subscriberDiscount
      - exemptUserLevel
      type: object
      properties:
        voteskip:
