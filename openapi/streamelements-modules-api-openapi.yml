          items:
            $ref: '#/components/schemas/AdditionalMessagesBot'
          description: ''
      example:
        enabled: true
        messages:
        - _id: 5b2e2007760aeb0fed487dc0
          amount: 1
          message: '{user} just raided the channel with {amount} viewers PogChamp'
    Pyramid:
