        minUserLevel:
          type: integer
          format: int32
        cost:
          type: integer
          format: int32
        subscriberDiscount:
          type: integer
          format: int32
        exemptUserLevel:
          type: integer
          format: int32
      example:
        voteskip:
          enabled: true
          votesRequired: 5
        enabled: true
        moderation: true
        minUserLevel: 100
        cost: 0
        subscriberDiscount: 50
        exemptUserLevel: 500
    FollowBot:
      title: Follow
      required:
      - enabled
      - messages
      type: object
