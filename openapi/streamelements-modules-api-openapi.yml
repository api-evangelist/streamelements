    Voteskip:
      title: Voteskip
      required:
      - enabled
      - votesRequired
      type: object
      properties:
        enabled:
          type: boolean
        votesRequired:
          type: integer
          format: int32
      example:
        enabled: true
        votesRequired: 5
    Announcements:
      title: Announcements
      required:
      - streamStart
      - enabled
      type: object
      properties:
        streamStart:
          $ref: '#/components/schemas/StreamStart'
        enabled:
          type: boolean
      example:
        streamStart:
          enabled: true
          message: '${channel.display_name} is now live! Streaming {game}: {title}'
        enabled: true
    StreamStart:
      title: StreamStart
      required:
      - enabled
      - message
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
      example:
        enabled: true
        message: '${channel.display_name} is now live! Streaming {game}: {title}'
    Slotmachine:
      title: Slotmachine
      required:
      - cooldown
      - messages
      - enabled
      - returnAmount
      - minAmount
      - emotes
      type: object
      properties:
        cooldown:
          $ref: '#/components/schemas/Cooldown'
