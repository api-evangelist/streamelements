        replies:
          type: boolean
        retweets:
          type: boolean
        template:
          type: string
        followed:
          type: array
          items:
            type: string
          description: ''
      example:
        enabled: false
        replies: false
        retweets: false
        template: '/me PogChamp new Tweet from {user}: {tweet}'
        followed:
        - twitchsupport
        - streamelements
    RaidBot:
