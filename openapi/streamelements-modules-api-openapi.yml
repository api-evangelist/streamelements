                    pointsWin: /me {winner} won the Duel vs {loser} PogChamp {winner} won {points} ${pointsname} FeelsGoodMan
                  enabled: false
                eightball:
                  cooldown:
                    user: 5
                    global: 15
                  enabled: false
                  messages:
                  - sure
                  - are you kidding?!
                  - yeah
                  - 'no'
                  - i think so
                  - don't bet on it
                  - ja
                  - doubtful
                  - for sure
                  - forget about it
                  - nein
                  - maybe
                  - Kappa Keepo PogChamp
                  - sure
                  - i don't think so
                  - it is so
                  - leaning towards no
                  - look deep in your heart and you will see the answer
                  - most definitely
                  - most likely
                  - my sources say yes
                  - never
