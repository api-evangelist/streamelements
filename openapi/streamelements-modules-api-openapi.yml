                  - that's a tough one
                  - idk kev
                  - don't ask that
                  - the answer to that isn't pretty
                  - the heavens point to yes
                  - who knows?
                  - without a doubt
                  - yesterday it would've been a yes, but today it's a yep
                  - you will have to wait
                  emotes:
                  - Kappa
                  - Keepo
                  - xD
                  - KKona
                  - 4Head
                  - EleGiggle
                  - DansGame
                  - KappaCool
                  - BrokeBack
                  - OpieOP
                  - KappaRoss
                  - KappaPride
                  - FeelsBadMan
                  - FeelsGoodMan
                  - FeelsBirthdayMan
                  - FeelsAmazingMan
                  - PogChamp
                  - VisLaud
                  - OhMyDog
                  - FrankerZ
                  - DatSheffy
                  - BabyRage
                  - VoHiYo
                  - haHAA
                  - LUL
                  - ResidentSleeper
                  - SourPls
                  - TriHard
                  - SMOrc
                emotecombo:
                  enabled: false
                  minCount: 5
                  cooldown: 10
                  messages:
                  - _id: 5b2e2007760aeb1d7e487dba
                    count: 3
                    message: '{count}x {emote} combo'
                  - _id: 5b2e2007760aeb31c3487db9
                    count: 10
                    message: '{count}x {emote} combo PogChamp'
                  - _id: 5b2e2007760aeb4b11487db8
                    count: 20
                    message: /me {user} ruined the {count}x {emote} combo KappaRoss
                  - _id: 5b2e2007760aeb4251487db7
