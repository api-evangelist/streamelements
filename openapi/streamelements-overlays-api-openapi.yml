openapi: 3.0.0
info:
  title: SE API Docs activities overlays API
  description: '## Custom Variable types

    `guid` - string that matches pattern: `/^[0-9a-fA-F]{24}$/` (24 character hexadecimal string)

    `datetime` - either timestamp in milliseconds (unix timestamp*1000) or string in ISO 8061 format

    ## Global variables

    `Authorization` - string:  JWT Token you can obtain here: https://streamelements.com/dashboard/account/channels (click "Show secrets")

    `channelId` - guid: obtained by requesting `/channels/me` endpoint with provided JWT token

    `channelName` - string: lowercase channel name

    `timezone` - integer: timezone index'
  contact: {}
  version: '1.0'
servers:
- url: https://api.streamelements.com/kappa/v2
  description: V2
  variables: {}
- url: https://api.streamelements.com/kappa/v3
  description: V3
  variables: {}
security:
- JWTBearer: []
- OAuth2: []
- ApiKeyBearer: []
tags:
- name: overlays
  description: Endpoints to manage overlays assigned to channel
paths:
  /overlays/{channel}:
    get:
      tags:
      - overlays
      summary: /:channel
      description: List overlays
      operationId: Get/:channel123456789
      parameters:
      - name: search
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: type
        in: query
        description: ''
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: tip
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      responses:
        '200':
          description: ''
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Fri, 07 Dec 2018 17:02:06 GMT
            Content-Length:
              content:
                text/plain:
                  schema:
                    type: string
                  example: '359'
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/OverlaysList'
              example:
                total: 1
                docs:
                - settings:
                    width: 1920
                    height: 1080
                    name: 1080p
                  type: regular
                  preview: https://static-cdn.jtvnw.net/ttv-static/404_boxart-272x380.jpg
                  mobile: false
                  _id: 5b2e2041760aeb87a0487dc7
                  game: null
                  name: snake
                  channel: 5b2e2007760aeb7729487dab
                  createdAt: '2018-06-23T10:26:09.04Z'
                  updatedAt: '2018-06-23T10:34:21.168Z'
      deprecated: false
  /overlays/{channel}/{overlayId}:
    get:
      tags:
      - overlays
      summary: /:channel/:overlayId
      description: Gets overlay details with all widgets on it
      operationId: /:channel/:overlayId
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: overlayId
        in: path
        description: guid - Overlay id
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Fri, 07 Dec 2018 17:03:00 GMT
            Content-Length:
              content:
                text/plain:
                  schema:
                    type: string
                  example: '36790'
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/OverlayData'
              example:
                settings:
                  width: 1920
                  height: 1080
                  name: 1080p
                type: regular
                preview: https://static-cdn.jtvnw.net/ttv-static/404_boxart-272x380.jpg
                widgets:
                - id: 1
                  type: se-widget-custom-event-list
                  visible: true
                  locked: false
                  listeners:
                    tip-latest: true
                    subscriber-latest: true
                    follower-latest: true
                    cheer-latest: true
                    host-latest: true
                    raid-latest: true
                    redemption-latest: true
                  css:
                    z-index: 2
                    top: -8.00px
                    left: -9.00px
                    width: 822.00px
                    height: 684.00px
                    opacity: 1
                  text:
                    type: text
                    enableShadow: true
                    scrolling:
                      direction: left
                      speed: 6
                    css:
                      position: relative
                      z-index: 1
                      font-family: Roboto
                      font-size: 24
                      color: '#fff'
                      font-weight: bold
                      text-shadow: rgb(0, 0, 0) 1px 1px 1px
                      text-align: left
                      line-height: 1.3
                      message:
                        enableShadow: false
                        font-family: Roboto
                        font-size: 16
                        line-height: 1.3
                        color: '#fff'
                        text-align: center
                  image:
                    type: image
                    css:
                      max-width: 100%
                  video:
                    type: video
                    css:
                      widget: 320
                      height: 240
                  audio:
                    type: audio
                    volume: 1
                  animation:
                    in: fadeIn
                    out: fadeOut
                    timeout: 6
                  variables:
                    css: ".main_canvas {\n  border: 1px solid;\n}\n"
                    html: "<div class=\"wrapper\">\n  <div id=\"score\">&nbsp;</div>\n  <canvas class=\"main_canvas\" width=600 height=600></canvas>\n</div>"
