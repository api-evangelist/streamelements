openapi: 3.0.0
info:
  title: SE API Docs activities single user API
  description: '## Custom Variable types

    `guid` - string that matches pattern: `/^[0-9a-fA-F]{24}$/` (24 character hexadecimal string)

    `datetime` - either timestamp in milliseconds (unix timestamp*1000) or string in ISO 8061 format

    ## Global variables

    `Authorization` - string:  JWT Token you can obtain here: https://streamelements.com/dashboard/account/channels (click "Show secrets")

    `channelId` - guid: obtained by requesting `/channels/me` endpoint with provided JWT token

    `channelName` - string: lowercase channel name

    `timezone` - integer: timezone index'
  contact: {}
  version: '1.0'
servers:
- url: https://api.streamelements.com/kappa/v2
  description: V2
  variables: {}
- url: https://api.streamelements.com/kappa/v3
  description: V3
  variables: {}
security:
- JWTBearer: []
- OAuth2: []
- ApiKeyBearer: []
tags:
- name: single user
  description: 'Endpoints to manage single user points data '
paths:
  /points/{channel}/{user}:
    get:
      tags:
      - single user
      summary: /:channel/:user
      description: Get userpoints for specific username
      operationId: /:channel/:user
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: user
        in: path
        description: string - Username
        required: true
        style: simple
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json; charset=utf-8
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
    delete:
      tags:
      - single user
      summary: /:channel/:user1
      description: Reset user points (remove from table)
      operationId: /:channel/:user1
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: user
        in: path
        description: string - Username
        required: true
        style: simple
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: text/plain; charset=utf-8
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
  /points/{channel}/{user}/rank:
    get:
      tags:
      - single user
      summary: /:channel/:user/rank
      description: Get current user rank by username
      operationId: /:channel/:user/rank
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: user
        in: path
        description: string - Username
        required: true
        style: simple
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json; charset=utf-8
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
  /points/{channel}/{user}/{amount}:
    put:
      tags:
      - single user
      summary: /:channel/:user/:amount
      description: Add or remove points from user
      operationId: /:channel/:user/:amount
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: user
        in: path
        description: string - Username
        required: true
        style: simple
        schema:
          type: string
      - name: amount
        in: path
        description: integer - Amount of points to be added, use negative number to remove points
        required: true
        style: simple
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json; charset=utf-8
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
  /points/{channel}/alltime/{user}/{amount}:
    put:
      tags:
      - single user
      summary: /:channel/alltime/:user/:amount
      description: Update alltime points for user
      operationId: /:channel/alltime/:user/:amount
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: user
        in: path
        description: string - username
        required: true
        style: simple
        schema:
          type: string
          example: leeeeex
      - name: amount
        in: path
        description: integer - amount of points to be added (negative if removed)
        required: true
        style: simple
        schema:
          type: integer
          format: int32
          example: 234
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: text/plain; charset=utf-8
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              example: {}
            example: {}
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
  /points/{channel}/alltime/{user}:
    delete:
      tags:
      - single user
      summary: /:channel/alltime/:user
      operationId: /:channel/alltime/:user
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: user
        in: path
