components:
  schemas:
    Paragraph:
      title: Paragraph
      required:
      - timeout
      - settings
      - enabled
      - exclude
      type: object
      properties:
        timeout:
          $ref: '#/components/schemas/Timeout'
        settings:
          $ref: '#/components/schemas/TimeoutSettings'
        enabled:
          type: boolean
        exclude:
          type: integer
          format: int32
      example:
        timeout:
          length: 300
        settings:
          limit: 250
        enabled: false
        exclude: 300
    Success16:
      title: Success16
      required:
      - public
      - excludeLevel
      - enabled
      - appliesTo
      - runsOn
      - _id
      - name
      - phrases
      - channel
      - lastUpdatedBy
      - createdAt
      - updatedAt
      type: object
      properties:
        public:
          type: boolean
        excludeLevel:
          type: integer
          format: int32
        enabled:
          type: boolean
        appliesTo:
          type: array
          items:
            type: string
          description: ''
        runsOn:
          type: array
          items:
            type: string
          description: ''
        _id:
          type: string
        name:
          type: string
        phrases:
          type: array
          items:
            type: string
          description: ''
        channel:
          type: string
        lastUpdatedBy:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      example:
        public: false
        excludeLevel: 500
        enabled: true
        appliesTo: []
        runsOn: []
        _id: 5c0b9794de9a4c1f3aa15034
        name: someInsult
        phrases: []
        channel: 5b2e2007760aeb7729487dab
        lastUpdatedBy: 5b2e2007760aeb7729487dab
        createdAt: '2018-12-08T10:06:12.342Z'
        updatedAt: '2018-12-08T10:06:12.342Z'
    Banphrases:
      title: Banphrases
      required:
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
      example:
        enabled: false
    Settings:
      title: Settings
      required:
      - limit
      - min
      - percent
      type: object
      properties:
        limit:
          type: integer
          format: int32
        min:
          type: integer
          format: int32
        percent:
          type: integer
          format: int32
      example:
        limit: 50
        min: 8
        percent: 60
    Caps:
      title: Caps
      required:
      - timeout
      - settings
      - enabled
      - exclude
      type: object
      properties:
        timeout:
          $ref: '#/components/schemas/Timeout'
        settings:
          $ref: '#/components/schemas/Settings'
        enabled:
          type: boolean
        exclude:
          type: integer
          format: int32
      example:
        timeout:
          length: 300
        settings:
          limit: 50
          min: 8
          percent: 60
        enabled: false
        exclude: 300
    BotFilters:
      title: BotFilters
      required:
      - caps
      - links
      - banphrases
      - emotes
      - symbols
      - paragraph
      type: object
      properties:
        caps:
          $ref: '#/components/schemas/Caps'
        links:
          $ref: '#/components/schemas/Links'
        banphrases:
          $ref: '#/components/schemas/Banphrases'
        emotes:
          $ref: '#/components/schemas/Emotes'
        symbols:
          $ref: '#/components/schemas/Symbols'
        paragraph:
          $ref: '#/components/schemas/Paragraph'
      example:
        caps:
          timeout:
            length: 300
          settings:
            limit: 50
            min: 8
            percent: 60
          enabled: false
          exclude: 300
        links:
          timeout:
            length: 300
          enabled: false
          exclude: 300
          whitelist: []
          blacklist: []
        banphrases:
          enabled: false
        emotes:
          timeout:
            length: 300
          settings:
            limit: 20
          enabled: false
          exclude: 300
        symbols:
          timeout:
            length: 300
          settings:
            limit: 50
            min: 15
            percent: 40
          enabled: false
          exclude: 300
        paragraph:
          timeout:
            length: 300
          settings:
            limit: 250
          enabled: false
          exclude: 300
    TimeoutSettings:
      title: TimeoutSettings
      required:
      - limit
      type: object
      properties:
        limit:
          type: integer
          format: int32
      example:
        limit: 20
    Timeout:
      title: Timeout
      required:
      - length
      type: object
      properties:
        length:
          type: integer
          format: int32
      example:
        length: 300
    Banphrasesrequest:
      title: New ban phrase
      required:
      - name
      type: object
      properties:
        name:
          type: string
      example:
        name: ''
    Links:
      title: Links
      required:
      - timeout
      - enabled
      - exclude
      - whitelist
      - blacklist
      type: object
      properties:
        timeout:
          $ref: '#/components/schemas/Timeout'
        enabled:
          type: boolean
        exclude:
          type: integer
          format: int32
        whitelist:
          type: array
          items:
            type: string
          description: ''
        blacklist:
          type: array
          items:
            type: string
          description: ''
      example:
        timeout:
          length: 300
        enabled: false
        exclude: 300
        whitelist: []
        blacklist: []
    Symbols:
      title: Symbols
      required:
      - timeout
      - settings
      - enabled
      - exclude
      type: object
