openapi: 3.0.0
info:
  title: SE API Docs activities filters API
  description: '## Custom Variable types

    `guid` - string that matches pattern: `/^[0-9a-fA-F]{24}$/` (24 character hexadecimal string)

    `datetime` - either timestamp in milliseconds (unix timestamp*1000) or string in ISO 8061 format

    ## Global variables

    `Authorization` - string:  JWT Token you can obtain here: https://streamelements.com/dashboard/account/channels (click "Show secrets")

    `channelId` - guid: obtained by requesting `/channels/me` endpoint with provided JWT token

    `channelName` - string: lowercase channel name

    `timezone` - integer: timezone index'
  contact: {}
  version: '1.0'
servers:
- url: https://api.streamelements.com/kappa/v2
  description: V2
  variables: {}
- url: https://api.streamelements.com/kappa/v3
  description: V3
  variables: {}
security:
- JWTBearer: []
- OAuth2: []
- ApiKeyBearer: []
tags:
- name: filters
  description: Bot spam filters management
paths:
  /bot/filters/banphrases/search:
    get:
      tags:
      - filters
      summary: /banphrases/search
      description: Get details for provided banned phrase id
      operationId: /banphrases/search
      parameters:
      - name: id
        in: query
        description: guid - banned phrase id
        required: true
        style: form
        explode: true
        schema:
          type: string
      - name: channel
        in: query
        description: string - channel name
        required: true
        style: form
        explode: true
        schema:
          type: string
          example: leeeeex
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json; charset=utf-8
      responses:
        '200':
          description: ''
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Sat, 08 Dec 2018 10:11:31 GMT
            Content-Length:
              content:
                text/plain:
                  schema:
                    type: string
                  example: '303'
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Success16'
                example:
                - public: false
                  excludeLevel: 500
                  enabled: true
                  appliesTo: []
                  runsOn: []
                  _id: 5c0b9794de9a4c1f3aa15034
                  name: someInsult
                  phrases: []
                  channel: 5b2e2007760aeb7729487dab
                  lastUpdatedBy: 5b2e2007760aeb7729487dab
                  createdAt: '2018-12-08T10:06:12.342Z'
                  updatedAt: '2018-12-08T10:06:12.342Z'
              example:
              - public: false
                excludeLevel: 500
                enabled: true
                appliesTo: []
                runsOn: []
                _id: 5c0b9794de9a4c1f3aa15034
                name: someInsult
                phrases: []
                channel: 5b2e2007760aeb7729487dab
                lastUpdatedBy: 5b2e2007760aeb7729487dab
                createdAt: '2018-12-08T10:06:12.342Z'
                updatedAt: '2018-12-08T10:06:12.342Z'
      deprecated: false
  /bot/filters/{channel}:
    get:
      tags:
      - filters
      summary: /:channel
      description: List filters
      operationId: Get/:channel123
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json; charset=utf-8
      responses:
        '200':
          description: ''
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                  example: Sat, 08 Dec 2018 09:58:59 GMT
            Content-Length:
              content:
                text/plain:
                  schema:
                    type: string
                  example: '928'
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/BotFilters'
              example:
                activitySettings:
                  enabled: false
                  enableDefaultPhrases: true
                  enableCustomPhrases: false
                  mode: 3
                  replaceWords:
                  - bunnies
                  - butterfly
                  - kitten
                  - love
                  - gingerly
                  - flowers
                  - puppy
                  - joyful
                  - rainbows
                  - unicorn
                botFilters:
                  caps:
                    timeout:
                      length: 300
                    settings:
                      limit: 50
                      min: 8
                      percent: 60
                    enabled: false
                    exclude: 300
                  links:
                    timeout:
                      length: 300
                    enabled: false
                    exclude: 300
                    whitelist: []
                    blacklist: []
                  banphrases:
                    enabled: false
                  emotes:
                    timeout:
                      length: 300
                    settings:
                      limit: 20
                    enabled: false
                    exclude: 300
                  symbols:
                    timeout:
                      length: 300
                    settings:
                      limit: 50
                      min: 15
                      percent: 40
                    enabled: false
                    exclude: 300
                  paragraph:
                    timeout:
                      length: 300
                    settings:
                      limit: 250
                    enabled: false
                    exclude: 300
                banphrases: []
                _id: 5b2e2007760aeb6949487daf
                channel: 5b2e2007760aeb7729487dab
                createdAt: '2018-06-23T10:25:11.768Z'
                updatedAt: '2018-06-23T10:25:11.768Z'
      deprecated: false
    put:
      tags:
      - filters
      summary: /:channel
      description: Update channel settings
      operationId: Put/:channel
      parameters:
      - name: channel
        in: path
        description: guid - Channel id
        required: true
        style: simple
        schema:
          type: string
          example: 5b2e2007760aeb7729487dab
      - name: Accept
        in: header
        description: ''
        required: true
        style: simple
        schema:
          type: string
          example: application/json; charset=utf-8
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: string
              example: '{"banphrases":,"filter":}'
            example: '{"banphrases":,"filter":}'
        required: true
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
