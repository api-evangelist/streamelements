components:
  schemas:
    AccessCodes:
      title: AccessCodes
      required:
      - keys
      - mode
      - random
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
          description: ''
        mode:
          type: string
        random:
          type: boolean
      example:
        keys: []
        mode: multi
        random: false
    LoyaltyItem:
      title: LoyaltyItem
      required:
      - bot
      - cooldown
      - quantity
      - alert
      - subscriberOnly
      - userInput
      - _id
      - enabled
      - featured
      - name
      - description
      - type
      - cost
      - public
      - channel
      - createdAt
      - updatedAt
      type: object
      properties:
        bot:
          $ref: '#/components/schemas/Bot2'
        cooldown:
          $ref: '#/components/schemas/Cooldown'
        quantity:
          $ref: '#/components/schemas/Quantity1'
        accessCodes:
          $ref: '#/components/schemas/AccessCodes'
        alert:
          $ref: '#/components/schemas/Alert'
        subscriberOnly:
          type: boolean
        userInput:
          type: array
          items:
            type: string
          description: ''
        _id:
          type: string
        enabled:
          type: boolean
        featured:
          type: boolean
        name:
          type: string
        description:
          type: string
        type:
          type: string
        cost:
          type: integer
          format: int32
        public:
          type: boolean
        channel:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      example:
        bot:
          enabled: true
          identifier: testitem
        cooldown:
          user: 5
          global: 0
        quantity:
          total: -1
        accessCodes:
          keys: []
          mode: multi
          random: false
        alert:
          graphics:
            duration: 8
          audio:
            volume: 0.5
            src: null
          enabled: true
        subscriberOnly: false
        userInput: []
        _id: 5c0bb2aede9a4c4402a15056
        enabled: true
        featured: false
        name: Test item
        description: Test description
        type: perk
        cost: 0
        public: false
        channel: 5b2e2007760aeb7729487dab
        createdAt: '2018-12-08T12:01:50.208Z'
        updatedAt: '2018-12-08T12:12:45.883Z'
    Notfound2:
      title: Notfound2
      required:
      - statusCode
      - error
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        error:
          type: string
      example:
        statusCode: 404
        error: Not Found
    Cooldown:
      title: Cooldown
      required:
      - user
      - global
      type: object
      properties:
        user:
          type: integer
          format: int32
        global:
          type: integer
          format: int32
      example:
        user: 15
        global: 5
    Detail:
      title: Detail
      required:
      - path
      - message
      type: object
      properties:
        path:
          type: array
          items:
            type: string
          description: ''
        message:
          type: string
      example:
        path:
        - types
        message: '"types" must be an array'
    Alert:
      title: Alert
      required:
      - graphics
      - audio
      - enabled
      type: object
      properties:
        graphics:
          $ref: '#/components/schemas/Graphics8'
        audio:
          $ref: '#/components/schemas/Audio1'
        enabled:
          type: boolean
      example:
        graphics:
          duration: 8
        audio:
          volume: 0.5
          src: null
        enabled: true
    Bot2:
      title: Bot2
      required:
      - enabled
      - identifier
      type: object
      properties:
        enabled:
          type: boolean
        identifier:
          type: string
      example:
        enabled: true
        identifier: testitem
    Quantity1:
      title: Quantity1
      required:
      - total
      type: object
      properties:
        total:
          type: integer
          format: int32
      example:
        total: -1
    Graphics8:
      title: Graphics8
      required:
      - duration
      type: object
      properties:
        duration:
          type: integer
          format: int32
      example:
        duration: 8
    Audio1:
      title: Audio1
      required:
      - src
      type: object
      properties:
        src:
          type: string
          nullable: true
        volume:
          type: number
      example:
        src: https://cdn.streamelements.com/static/alertbox/default.ogg
        volume: 0.5
    400-badrequest:
      title: 400-badrequest
      required:
      - statusCode
      - error
      - message
      - details
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/Detail'
          description: ''
      example:
        statusCode: 400
        error: Bad Request
        message: 'child "giveawayId" fails because ["giveawayId" with value "5c10e383bd1e475b7c3d6eb" fails to match the required pattern: /^[0-9a-fA-F]{24}$/]'
        details:
        - path:
          - giveawayId
          message: '"giveawayId" with value "5c10e383bd1e475b7c3d6eb" fails to match the required pattern: /^[0-9a-fA-F]{24}$/'
  securitySchemes:
    JWTBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyBearer:
      type: http
      scheme: bearer
      name: apiKey
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.streamelements.com/oauth2/authorize
          tokenUrl: https://api.streamelements.com/oauth2/token
          scopes:
            tips:read: Ability read of tips
            tips:write: Grants create/modify/delete tips
            activities:read: Grants read of activities
            activities:write: Grants create activities
            loyalty:read: Grants read of loyalty settings and the leaderboard
            loyalty:write: Grants update of loyalty settings and update the leaderboard
            overlays:read: Grants read overlays
            overlays:write: Grants creation, update, deletion of overlays
            store:read: Grants read redemptions and items
            store:write: Grants create new store items and complete redemptions
            bot:read: Grants read timers, commands, spam filters and modules
            bot:write: Grants create and update timers, commands, spam filters and modules
            session:read: Grants read of session data
            contest:read: Grants read of contests
            contest:write: Grants create and update contests
            giveaway:read: Grants read of giveaways
            giveaway:write: Grants create and update giveaways
