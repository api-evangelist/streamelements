aid: streamelements
name: StreamElements
description: StreamElements is a cloud-based platform for live streamers and content creators on Twitch,
  YouTube, Kick and Facebook, offering 100% free customizable overlays and alerts, a chatbot, tipping
  and donations, loyalty points, giveaways and contests, song requests, a media/merch store, brand sponsorships,
  and analytics — all managed from the StreamElements dashboard. Developers integrate through a public
  REST API at api.streamelements.com (kappa v2/v3) authenticated with JWT, overlay API keys, or OAuth2,
  plus the Astro real-time WebSocket gateway (wss://astro.streamelements.com) for live event topics.
